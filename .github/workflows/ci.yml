name: Crenelle CI

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .gitignore integrity & secret rules
        run: |
          grep -q -E "^\.env$" .gitignore || (echo "CRITICAL: .env has been removed from .gitignore!" && exit 1)
          if git ls-files | grep -E "^\.env($|\.)" | grep -v "\.example$"; then
            echo "CRITICAL: Sensitive .env file is tracked in git history!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          RESEND_API_KEY: re_placeholder

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          RESEND_API_KEY: re_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
